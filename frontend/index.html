<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Tools</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="session-sidebar" aria-label="创作会话">
        <header class="sidebar-brand">
          <img src="/static/assets/app-icon.png" alt="" />
          <h1>Image Tools <span>Work</span></h1>
          <button
            id="searchToggle"
            type="button"
            class="icon-button"
            aria-label="搜索会话"
            title="搜索会话"
          >
            <i data-lucide="search"></i>
          </button>
        </header>

        <nav class="primary-nav" aria-label="工作区">
          <button id="newSessionBtn" type="button">
            <i data-lucide="square-pen"></i>
            <span>新建任务</span>
          </button>
          <button id="providersBtn" type="button">
            <i data-lucide="panels-top-left"></i>
            <span>Providers</span>
          </button>
        </nav>

        <div id="searchPanel" class="search-panel" hidden>
          <i data-lucide="search" aria-hidden="true"></i>
          <input
            id="sessionFilter"
            type="search"
            placeholder="搜索会话"
            autocomplete="off"
          />
        </div>

        <div class="sidebar-section-label">会话</div>
        <nav id="sessionList" class="session-list" aria-label="历史会话"></nav>

        <footer class="workspace-account">
          <span>本地工作区</span>
          <button id="settingsBtn" type="button" class="icon-button" aria-label="设置" title="设置">
            <i data-lucide="settings"></i>
          </button>
        </footer>
      </aside>

      <main class="workspace" aria-label="当前创作会话">
        <header id="taskHeader" class="task-header">
          <div class="task-heading">
            <h2 id="currentSessionTitle">新任务</h2>
            <p id="currentSessionSubtitle">图片创作</p>
          </div>
          <div class="workspace-actions">
            <button
              id="taskMenuBtn"
              type="button"
              class="icon-button"
              aria-label="会话操作"
              title="会话操作"
              aria-haspopup="menu"
              aria-expanded="false"
              disabled
            >
              <i data-lucide="ellipsis"></i>
            </button>
            <div id="taskMenu" class="task-menu" role="menu" hidden>
            <button
              id="renameSessionBtn"
              type="button"
              role="menuitem"
              disabled
            >
              <i data-lucide="pencil"></i>
              <span>重命名</span>
            </button>
            <button
              id="deleteSessionBtn"
              type="button"
              class="danger-menu-item"
              role="menuitem"
              disabled
            >
              <i data-lucide="trash-2"></i>
              <span>删除</span>
            </button>
            </div>
          </div>
        </header>

        <section id="timeline" class="timeline" aria-live="polite">
          <div class="empty-workspace">
            <img src="/static/assets/app-icon.png" alt="" />
            <h2>今天想创作什么？</h2>
          </div>
        </section>

        <form id="composerForm" class="composer" aria-label="图片生成输入">
          <div class="composer-context">
            <div id="referencePreview" class="reference-preview" hidden>
              <i data-lucide="image" aria-hidden="true"></i>
              <span id="referenceName"></span>
              <button
                id="clearReferenceBtn"
                type="button"
                class="icon-button"
                aria-label="移除参考图"
                title="移除参考图"
              >
                <i data-lucide="x"></i>
              </button>
            </div>
            <label class="context-field provider-field">
              <span class="sr-only">Provider</span>
              <select id="providerSelect" aria-label="Provider"></select>
            </label>
            <label class="context-field model-field">
              <span class="sr-only">模型</span>
              <input
                id="modelInput"
                aria-label="模型"
                autocomplete="off"
                value="gpt-image-2"
              />
            </label>
          </div>

          <textarea
            id="prompt"
            rows="2"
            placeholder="描述你想创作的图片"
          ></textarea>

          <input id="referenceInput" type="file" accept="image/*" hidden />
          <div class="composer-toolbar">
            <div class="composer-tools">
              <button
                id="referenceBtn"
                type="button"
                class="icon-button"
                aria-label="添加参考图"
                title="添加参考图"
                aria-haspopup="menu"
                aria-expanded="false"
              >
                <i data-lucide="plus"></i>
              </button>
              <button
                id="parameterMenuBtn"
                type="button"
                class="parameter-summary"
                aria-haspopup="menu"
                aria-expanded="false"
                aria-label="图片参数"
              >
                <span id="parameterSummaryText">1:1 · 标准 · 1 张</span>
                <i data-lucide="chevron-down"></i>
              </button>
            </div>
            <button
              id="generateBtn"
              type="submit"
              class="send-button"
              aria-label="开始生成"
              title="开始生成"
              disabled
            >
              <i data-lucide="arrow-up"></i>
            </button>
          </div>
        </form>
      </main>
    </div>

    <div id="parameterMenu" class="popover parameter-menu" role="menu" aria-label="图片参数" hidden>
      <div class="parameter-grid">
        <label>
          <span>比例</span>
          <select id="ratioSelect">
            <option value="1:1">1:1</option>
            <option value="3:2">3:2</option>
            <option value="2:3">2:3</option>
            <option value="16:9">16:9</option>
            <option value="9:16">9:16</option>
          </select>
        </label>
        <label>
          <span>尺寸</span>
          <select id="resolutionSelect">
            <option value="standard">标准</option>
            <option value="medium">高清</option>
            <option value="large">超清</option>
          </select>
        </label>
        <label>
          <span>质量</span>
          <select id="qualitySelect">
            <option value="auto">自动</option>
            <option value="high">高</option>
            <option value="medium">中</option>
            <option value="low">低</option>
          </select>
        </label>
        <label>
          <span>张数</span>
          <select id="countSelect">
            <option value="1">1 张</option>
            <option value="2">2 张</option>
            <option value="3">3 张</option>
            <option value="4">4 张</option>
          </select>
        </label>
      </div>
      <details id="advancedParamsPanel" class="advanced-options">
        <summary>高级参数</summary>
        <div class="parameter-grid advanced-grid">
          <label>
            <span>输出格式</span>
            <select id="outputFormatSelect">
              <option value="png">PNG</option>
              <option value="jpeg">JPEG</option>
              <option value="webp">WebP</option>
            </select>
          </label>
          <label>
            <span>压缩</span>
            <input
              id="outputCompressionInput"
              type="number"
              min="0"
              max="100"
              value="100"
            />
          </label>
          <label>
            <span>背景</span>
            <select id="backgroundSelect">
              <option value="auto">自动</option>
              <option value="opaque">不透明</option>
              <option value="transparent">透明</option>
            </select>
          </label>
          <label>
            <span>审核</span>
            <select id="moderationSelect">
              <option value="auto">自动</option>
              <option value="low">较低</option>
            </select>
          </label>
        </div>
      </details>
    </div>

    <div id="referenceMenu" class="popover reference-menu" role="menu" hidden>
      <button id="uploadReferenceBtn" type="button" role="menuitem">
        <i data-lucide="upload"></i>
        <span>上传参考图</span>
      </button>
    </div>

    <dialog id="providerDialog" class="app-dialog" aria-labelledby="providerDialogTitle">
      <header>
        <h2 id="providerDialogTitle">Providers</h2>
        <button
          id="providerDialogClose"
          type="button"
          class="icon-button"
          aria-label="关闭"
          title="关闭"
        >
          <i data-lucide="x"></i>
        </button>
      </header>
      <div class="provider-dialog-grid">
        <section class="provider-list-pane">
          <div class="provider-pane-heading">
            <span>已保存</span>
            <button id="addProviderBtn" type="button" class="icon-button" aria-label="新增 Provider" title="新增 Provider">
              <i data-lucide="plus"></i>
            </button>
          </div>
          <div id="providerList" class="provider-list"></div>
        </section>
        <form id="providerForm" class="provider-form">
          <h3 id="providerEditorTitle">新增 Provider</h3>
          <label>
            <span>名称</span>
            <input id="providerName" required autocomplete="off" />
          </label>
          <label>
            <span>Base URL</span>
            <input id="providerBaseUrl" required type="url" autocomplete="url" />
          </label>
          <label>
            <span>API Key</span>
            <input id="providerApiKey" type="password" autocomplete="new-password" placeholder="输入 API Key" />
          </label>
          <label>
            <span>默认模型</span>
            <input id="providerDefaultModel" required value="gpt-image-2" autocomplete="off" />
          </label>
          <label class="checkbox-field">
            <input id="providerIsDefault" type="checkbox" />
            <span>设为默认 Provider</span>
          </label>
          <footer>
            <button id="providerCancelBtn" type="button" class="dialog-button">取消</button>
            <button id="providerSaveBtn" type="submit" class="dialog-button primary">保存</button>
          </footer>
        </form>
      </div>
      <section class="storage-location-section" aria-labelledby="storageLocationTitle">
        <div class="storage-location-heading">
          <h3 id="storageLocationTitle">本地数据</h3>
          <output id="storageCurrentPath" aria-label="当前数据目录"></output>
        </div>
        <form id="storageLocationForm" class="storage-location-form">
          <label>
            <span>新的数据目录</span>
            <input
              id="storageDataDir"
              required
              autocomplete="off"
              placeholder="D:\\Image Tools"
            />
          </label>
          <label class="checkbox-field">
            <input id="storageMigrateExisting" type="checkbox" />
            <span>复制现有会话和文件</span>
          </label>
          <footer>
            <p id="storageLocationStatus" role="status" hidden></p>
            <button id="storageApplyBtn" type="submit" class="dialog-button primary">应用</button>
          </footer>
        </form>
      </section>
    </dialog>
    <dialog id="sessionDialog" class="app-dialog" aria-labelledby="sessionDialogTitle">
      <form id="sessionDialogForm">
        <h2 id="sessionDialogTitle">会话</h2>
        <p id="sessionDialogMessage" hidden></p>
        <label id="sessionTitleField">
          <span>名称</span>
          <input id="sessionTitleInput" autocomplete="off" />
        </label>
        <footer>
          <button id="sessionDialogCancel" type="button" class="dialog-button">
            取消
          </button>
          <button id="sessionDialogSubmit" type="submit" class="dialog-button primary">
            保存
          </button>
        </footer>
      </form>
    </dialog>
    <dialog id="imagePreviewDialog" class="image-preview-dialog" aria-label="图片预览">
      <button id="imagePreviewClose" type="button" class="icon-button" aria-label="关闭预览" title="关闭预览">
        <i data-lucide="x"></i>
      </button>
      <img id="imagePreview" alt="生成结果预览" />
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>

    <script src="/static/preferences.js"></script>
    <script src="/static/workbench.js"></script>
    <script src="/static/vendor/lucide.min.js"></script>
    <script src="/static/icons.js"></script>
    <script src="/static/ui.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
