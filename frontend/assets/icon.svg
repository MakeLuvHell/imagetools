<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 主体图形渐变 -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="30%" stop-color="#2563EB" />
      <stop offset="70%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <!-- 镜头/光圈部分渐变 -->
    <linearGradient id="shutterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- 阴影滤镜让图标更有立体感 -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1E3A8A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 核心艺术化图形组 -->
  <g filter="url(#dropShadow)" transform="translate(10, 10)">
    
    <!-- 底部艺术波浪线条与像素颗粒 -->
    <path d="M 170 380 C 220 410 300 400 340 350 C 310 380 250 385 200 365 C 180 355 170 345 165 330 C 150 350 155 370 170 380 Z" fill="#1D4ED8" opacity="0.8" />
    <path d="M 190 350 C 240 380 320 360 355 310 C 310 350 250 350 210 330 C 190 320 185 310 185 300 C 175 320 180 340 190 350 Z" fill="#60A5FA" opacity="0.6" />
    
    <!-- 核心"A"字形流线主体（加了白色描边衬底，确保在深色背景下也很清晰） -->
    <path d="M 160 340 C 130 310 135 250 180 190 C 220 135 260 90 295 90 C 320 90 340 120 335 165 C 330 210 295 260 270 290 C 250 315 260 330 285 320 C 330 300 365 240 375 210 C 385 250 350 330 290 355 C 240 375 190 370 160 340 Z" fill="#FFFFFF" />
    <path d="M 168 332 C 142 305 147 253 188 196 C 226 144 264 100 295 100 C 316 100 331 126 327 163 C 322 204 290 251 266 279 C 243 306 252 318 276 308 C 318 290 351 234 362 205 C 370 240 338 316 284 341 C 238 360 194 356 168 332 Z" fill="url(#mainGrad)" />

    <!-- 右侧光圈/镜头元素 (代表图片生成与相机捕捉) -->
    <g transform="translate(330, 190)">
      <circle cx="40" cy="40" r="42" fill="#FFFFFF" />
      <circle cx="40" cy="40" r="36" fill="url(#shutterGrad)" />
      <polygon points="40,15 65,25 50,45" fill="#FFFFFF" opacity="0.3"/>
      <polygon points="65,25 70,50 48,52" fill="#FFFFFF" opacity="0.2"/>
      <polygon points="70,50 50,68 38,48" fill="#FFFFFF" opacity="0.3"/>
      <polygon points="50,68 20,60 35,40" fill="#FFFFFF" opacity="0.2"/>
      <polygon points="20,60 20,30 40,40" fill="#FFFFFF" opacity="0.3"/>
      <polygon points="40,28 50,34 50,46 40,52 30,46 30,34" fill="#FFFFFF" />
    </g>

    <!-- 顶部璀璨星光/四角星 -->
    <path d="M 325 50 L 333 75 L 358 83 L 333 91 L 325 116 L 317 91 L 292 83 L 317 75 Z" fill="#3B82F6" />
    <path d="M 325 65 L 329 79 L 343 83 L 329 87 L 325 101 L 321 87 L 307 83 L 321 79 Z" fill="#FFFFFF" />
    
    <!-- 周围点缀的微尘与次级星光 -->
    <circle cx="375" cy="110" r="8" fill="#60A5FA" />
    <circle cx="375" cy="110" r="4" fill="#FFFFFF" />
    <path d="M 150 140 L 153 147 L 160 150 L 153 153 L 150 160 L 147 153 L 140 150 L 147 147 Z" fill="#60A5FA" />

    <!-- 科技感像素方块 -->
    <rect x="100" y="210" width="16" height="16" rx="2" fill="#1D4ED8" />
    <rect x="120" y="190" width="20" height="20" rx="3" fill="#3B82F6" />
    <rect x="95" y="235" width="12" height="12" rx="2" fill="#60A5FA" />
    <rect x="125" y="165" width="14" height="14" rx="2" fill="#2563EB" opacity="0.6" />
    <rect x="230" y="385" width="16" height="16" rx="2" fill="#1D4ED8" />
    <rect x="255" y="375" width="14" height="14" rx="2" fill="#60A5FA" />
  </g>
</svg>
