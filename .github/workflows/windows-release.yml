name: Windows x64 Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to upload Windows x64 assets to
        required: true
        default: v0.3.0
      build_ref:
        description: Git ref to build from
        required: true
        default: v0.3.0

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Build Windows x64 release
    runs-on: windows-latest

    steps:
      - name: Checkout build ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref }}

      - name: Install mise tools
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install project dependencies
        shell: pwsh
        run: mise run install

      - name: Build Windows x64 MSI
        shell: pwsh
        env:
          TAURI_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: |
          mise exec -- pwsh -NoProfile -Command '
            $env:RUSTUP_DIST_SERVER = "https://static.rust-lang.org"
            $env:RUSTUP_UPDATE_ROOT = "https://static.rust-lang.org/rustup"
            npm run desktop:build:windows
          '

      - name: Stage MSI and portable assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          if ($env:RELEASE_TAG -cnotmatch '^[A-Za-z0-9._-]+$') {
            throw "Release tag contains characters that are unsafe in asset filenames: $($env:RELEASE_TAG)"
          }

          $assetDirectory = "release-assets"
          $msiDirectory = "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\msi"
          $msiFiles = @(Get-ChildItem $msiDirectory -Filter "*.msi" -File)
          if ($msiFiles.Count -ne 1) {
            throw "Expected exactly one MSI in $msiDirectory; found $($msiFiles.Count)."
          }

          New-Item -ItemType Directory -Path $assetDirectory -Force | Out-Null
          $msiOutput = "release-assets/Image-Tools-$($env:RELEASE_TAG)-Windows-x64.msi"
          $portableOutput = "release-assets/Image-Tools-$($env:RELEASE_TAG)-Windows-x64-Portable.zip"
          Copy-Item -LiteralPath $msiFiles[0].FullName -Destination $msiOutput -Force

          $portableExecutable = "src-tauri\target\x86_64-pc-windows-msvc\release\Image Tools.exe"
          & pwsh -NoProfile -File scripts/package_windows_portable.ps1 `
            -Executable $portableExecutable `
            -Output $portableOutput
          if ($LASTEXITCODE -ne 0) {
            throw "Portable packaging failed with exit code $LASTEXITCODE."
          }

      - name: Verify Windows single-process release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $msiAsset = "release-assets/Image-Tools-$($env:RELEASE_TAG)-Windows-x64.msi"
          $portableAsset = "release-assets/Image-Tools-$($env:RELEASE_TAG)-Windows-x64-Portable.zip"
          & pwsh -NoProfile -File scripts/verify_windows_single_process.ps1 `
            -Msi $msiAsset `
            -PortableZip $portableAsset
          if ($LASTEXITCODE -ne 0) {
            throw "Windows single-process verification failed with exit code $LASTEXITCODE."
          }

      - name: Upload Windows release assets as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tools-${{ inputs.release_tag }}-windows-x64
          path: |
            release-assets/Image-Tools-${{ inputs.release_tag }}-Windows-x64.msi
            release-assets/Image-Tools-${{ inputs.release_tag }}-Windows-x64-Portable.zip
          if-no-files-found: error

      - name: Ensure GitHub Release exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $releaseNotes = "docs/releases/$($env:RELEASE_TAG).md"
          & gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null

          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $releaseNotes) {
              & gh release create $env:RELEASE_TAG `
                --repo $env:GITHUB_REPOSITORY `
                --verify-tag `
                --title "Image Tools $($env:RELEASE_TAG)" `
                --notes-file $releaseNotes
            } else {
              & gh release create $env:RELEASE_TAG `
                --repo $env:GITHUB_REPOSITORY `
                --verify-tag `
                --title "Image Tools $($env:RELEASE_TAG)" `
                --generate-notes
            }

            if ($LASTEXITCODE -ne 0) {
              throw "Unable to create GitHub Release $($env:RELEASE_TAG)."
            }
          }

      - name: Upload Windows assets to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $assets = @(
            "release-assets/Image-Tools-$($env:RELEASE_TAG)-Windows-x64.msi",
            "release-assets/Image-Tools-$($env:RELEASE_TAG)-Windows-x64-Portable.zip"
          )

          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Release asset is missing: $asset"
            }
            & gh release upload $env:RELEASE_TAG $asset --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to upload $asset to GitHub Release $($env:RELEASE_TAG)."
            }
          }
