name: 功能建议
description: 描述用户目标、使用场景和期望结果
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: users
    attributes:
      label: 目标用户
      description: 谁会使用这项能力？
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 在什么情况下需要它？当前流程哪里不足？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 描述完成后的用户结果，不必限定具体 UI 或实现。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我已阅读项目路线图，并搜索了现有 Issue。
          required: true
