name: 缺陷报告
description: 报告可以稳定复现的 Image Tools 行为问题
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: 请先搜索现有 Issue。不要粘贴 API Key、完整数据库、私人提示词或图片。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 例如 v0.4.0，可在 Release 或应用文件属性中确认。
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: 安装方式
      options:
        - MSI
        - Portable ZIP
        - 本地源码构建
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Provider 协议
      options:
        - 与 Provider 无关
        - OpenAI Compatible
        - xAI Imagine
        - Gemini Native Image
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从应用启动开始，提供最小且稳定的操作步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可附脱敏日志或截图。请再次确认其中没有 API Key 和私人数据。
  - type: checkboxes
    id: sensitive
    attributes:
      label: 敏感信息确认
      options:
        - label: 我已删除 API Key、Authorization Header、私人提示词、图片和本机身份信息。
          required: true
