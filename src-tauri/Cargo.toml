[package]
name = "imagetools"
version = "0.4.0"
description = "Image Tools desktop app"
authors = ["Image Tools"]
edition = "2021"
license = "MIT"
repository = "https://github.com/MakeLuvHell/imagetools"
homepage = "https://github.com/MakeLuvHell/imagetools"

[[bin]]
name = "imagetools"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
mime_guess = "2"
futures-util = "0.3"
atomic-write-file = "0.3"
percent-encoding = "2"
cap-std = "4"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
